name: Container security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  image-security:
    name: Production image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --pull --tag production-security:${{ github.sha }} .
      - name: Scan OS and application packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: production-security:${{ github.sha }}
          scanners: vuln
          format: json
          output: image-vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m
      - name: Block fixable high and critical vulnerabilities
        run: python3 scripts/check-image-vulnerabilities.py image-vulnerabilities.json
      - name: Retain the complete vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-image-vulnerabilities
          path: image-vulnerabilities.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish verified image to Vertex registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 40); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | first | .conclusion // "pending"')
            if [ "$state" = success ]; then ready=true; break; fi
            if [ "$state" != pending ]; then echo "Main CI ended: $state"; exit 1; fi
            sleep 15
          done
          if [ "$ready" != true ]; then echo "Main CI did not finish successfully"; exit 1; fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then echo "Skipping superseded commit"; exit 0; fi
          image="ghcr.io/paul1404/diatrack:sha-$GITHUB_SHA"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "production-security:$GITHUB_SHA" "$image"
          docker push "$image"

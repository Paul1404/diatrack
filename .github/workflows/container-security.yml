name: Container security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-security:
    name: Production image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --pull --tag production-security:${{ github.sha }} .
      - name: Scan OS and application packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: production-security:${{ github.sha }}
          scanners: vuln
          format: json
          output: image-vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m
      - name: Block fixable high and critical vulnerabilities
        run: python3 scripts/check-image-vulnerabilities.py image-vulnerabilities.json
      - name: Retain the complete vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-image-vulnerabilities
          path: image-vulnerabilities.json
          retention-days: 14
          if-no-files-found: error

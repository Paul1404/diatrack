name: Sync bun.lock on Dependabot PRs

# Dependabot's Bun support bumps package.json but frequently leaves bun.lock
# stale, which then breaks `bun install --frozen-lockfile` in CI and on Railway.
# This workflow regenerates the lockfile to match the updated manifest and
# commits it back to the Dependabot PR branch so the PR is mergeable and deploys
# cleanly.

on:
  pull_request:
    paths:
      - "package.json"

# Only Dependabot PRs (same-repo branches), and only the lockfile is touched.
permissions:
  contents: write

jobs:
  sync-lockfile:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # --ignore-scripts: resolve and write the lockfile without executing any
      # dependency lifecycle scripts (the workflow token has write access).
      - name: Regenerate lockfile
        run: bun install --ignore-scripts

      - name: Commit bun.lock if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync bun.lock with package.json"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$PR_BRANCH"
